<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكايتنا الحلوة | 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0a0612; color: #f8fafc; margin: 0; overflow-x: hidden; }
        .font-art { font-family: 'Aref Ruqaa', serif; }
        
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top, #1a0b2e 0%, #0a0612 100%);
            z-index: -2;
        }

        #snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; opacity: 0.4; }

        /* زر القلب */
        .romance-control { position: fixed; bottom: 50px; left: 30px; z-index: 100; }
        .heart-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 1px solid rgba(255, 77, 109, 0.3);
            transition: 0.5s; font-size: 1.5rem;
        }
        .heart-btn:hover { background: rgba(255, 77, 109, 0.2); transform: scale(1.1); box-shadow: 0 0 20px rgba(255, 77, 109, 0.4); }

        /* الهوفر الفخم للصور */
        .art-card-premium {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(253, 164, 175, 0.1);
            border-radius: 2rem; padding: 10px;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden; cursor: pointer;
        }
        .art-card-premium img { transition: all 0.8s ease; width: 100%; height: 450px; object-cover: cover; border-radius: 1.5rem; }

        .art-card-premium:hover {
            border-color: #fda4af;
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 40px rgba(253, 164, 175, 0.15), 0 0 100px rgba(253, 164, 175, 0.05);
        }
        .art-card-premium:hover img { transform: scale(1.1); filter: brightness(1.1); }

        .glass-gradient {
            background: linear-gradient(180deg, rgba(253, 164, 175, 0.08) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 2px solid rgba(253, 164, 175, 0.1);
            backdrop-filter: blur(12px);
        }

        .heart-particle {
            position: fixed; pointer-events: none; z-index: 99;
            animation: fly 4s ease-out forwards;
        }
        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stars-container"></div>
    <canvas id="snow"></canvas>

    <div class="romance-control">
        <button id="romanceBtn" class="heart-btn">❤️</button>
    </div>

    <header class="min-h-screen flex flex-col items-center justify-center text-center px-6">
        <h1 class="font-art text-7xl md:text-[8rem] mb-6 text-white drop-shadow-2xl opacity-90">حكايتنا الحلوة..</h1>
        <p class="text-rose-300 font-bold tracking-[0.3em] mb-12 text-sm opacity-80 uppercase">سنة جديدة بضحكتك</p>
        
        <div class="glass-gradient p-10 md:p-14 rounded-[3.5rem] w-full max-w-sm md:max-w-md shadow-2xl">
            <div class="grid grid-cols-3 gap-6">
                <div class="text-center">
                    <span id="days" class="text-4xl md:text-6xl font-bold block text-white tracking-tighter">0</span>
                    <span class="text-[9px] text-rose-300 uppercase font-bold mt-2 block tracking-widest">يوم عدا</span>
                </div>
                <div class="text-center">
                    <span id="hours" class="text-4xl md:text-6xl font-bold block text-white tracking-tighter">0</span>
                    <span class="text-[9px] text-rose-300 uppercase font-bold mt-2 block tracking-widest">ساعة</span>
                </div>
                <div class="text-center">
                    <span id="mins" class="text-4xl md:text-6xl font-bold block text-white tracking-tighter">0</span>
                    <span class="text-[9px] text-rose-300 uppercase font-bold mt-2 block tracking-widest">دقيقة</span>
                </div>
            </div>
        </div>
    </header>

    <section class="max-w-7xl mx-auto px-6 py-24">
        <h3 class="font-art text-3xl text-center mb-20 text-white opacity-60">لحظات من الذكرى..</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
            <div class="art-card-premium"><img src="https://i.ibb.co/2YvxKvJN/IMG-20251231-095742.jpg"></div>
            <div class="art-card-premium"><img src="https://i.ibb.co/ZR1f483D/IMG-20251231-095718.jpg"></div>
            <div class="art-card-premium"><img src="https://i.ibb.co/G3r8xnk2/IMG-20250930-WA0003-1.jpg"></div>
            <div class="art-card-premium"><img src="https://i.ibb.co/1fxhZYqs/IMG-20250930-WA0006-1.jpg"></div>
            <div class="art-card-premium"><img src="https://i.ibb.co/V0gSpQDM/IMG-20251230-WA0115.jpg"></div>
            <div class="art-card-premium"><img src="https://i.ibb.co/TMDbys6K/IMG-20251230-WA0114.jpg"></div>
        </div>
    </section>

    <footer class="py-40 text-center px-6">
        <div class="max-w-2xl mx-auto">
            <h2 class="font-art text-3xl md:text-5xl text-white mb-12 opacity-80 leading-relaxed">سنة جديدة بتبدأ بيكي..</h2>
            <button onclick="finalBlow()" class="bg-white/5 hover:bg-white/10 border border-white/20 text-white px-16 py-5 rounded-full font-bold shadow-xl transition-all transform hover:scale-105 active:scale-95 text-lg">
                ليكِ إنتِ ✨
            </button>
            <div id="giftMsg" class="hidden mt-20 space-y-8 animate-fade-in">
                <h4 class="font-art text-5xl md:text-7xl text-rose-300 drop-shadow-lg">Happy Birthday! ❤️</h4>
                <p class="text-slate-400 text-lg md:text-xl leading-relaxed max-w-lg mx-auto italic font-light">
                    النهاردة مش بس بداية 2026، النهاردة يوم ميلاد الشخص اللي خلى لـ 2025 طعم تاني خالص. يا رب كل سنينك اللي جاية تكون ألوان وفرحة زيك.
                </p>
            </div>
        </div>
    </footer>

    <script>
        // العداد
        const start = new Date("February 28, 2025 00:00:00").getTime();
        function updateCounter() {
            const now = new Date().getTime();
            const diff = now - start;
            document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("mins").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        }
        setInterval(updateCounter, 1000);
        updateCounter();

        // تأثير القلوب (أخف)
        document.getElementById('romanceBtn').onclick = () => {
            for(let i=0; i<8; i++) { // العدد قل عشان يكون ألطف
                setTimeout(createHeart, i * 300);
            }
        };

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = ["❤️", "✨", "🌸"][Math.floor(Math.random()*3)];
            heart.style.left = (20 + Math.random() * 60) + "vw";
            heart.style.bottom = "-5vh";
            heart.style.fontSize = (Math.random() * 15 + 15) + "px";
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        // الثلج
        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth, height = window.innerHeight;
        canvas.width = width; canvas.height = height;
        let snowflakes = Array.from({ length: 60 }, () => ({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 2 + 1, d: Math.random() * 1 }));
        function drawSnow() {
            ctx.clearRect(0, 0, width, height); ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath(); snowflakes.forEach(f => {
                ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                f.y += 1; if (f.y > height) f.y = -10;
            });
            ctx.fill(); requestAnimationFrame(drawSnow);
        }
        drawSnow();

        function finalBlow() {
            confetti({ particleCount: 150, spread: 60, origin: { y: 0.8 }, colors: ['#fda4af', '#ffffff'] });
            document.getElementById("giftMsg").classList.remove("hidden");
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
